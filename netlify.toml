[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

# ----- Redirect bots to Prerender -----
[[redirects]]
  from = "/*"
  to = "https://service.prerender.io/https://brandexco.com/:splat"
  status = 200
  force = true
  conditions = { UserAgent = "(?i)Googlebot|Bingbot|Yahoo|DuckDuckBot|Yandex" }

# ----- Global headers -----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Prerender-Token = "eP5ks6jBYCLP68HHIEub"
